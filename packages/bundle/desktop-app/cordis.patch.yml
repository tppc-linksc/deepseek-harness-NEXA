# Desktop is the Web GUI composition with only its physical carrier replaced.
- id: web-startup
  disabled: true
- id: webserver
  disabled: true
- id: web-runtime
  disabled: true
- id: client-hmr
  disabled: true
- id: modules-web
  disabled: true
- id: connection-web
  disabled: true
- id: directory-picker
  disabled: true

- insert:
    - id: desktop-app
      name: '@deepseek-ai/dsh-desktop-app'

    # Community plugin and theme discovery. The desktop Host supplies its
    # public compatibility services over private IPC without a listening port.
    - id: dsh-market
      name: 'dshmarket'

    - id: directory-picker-desktop
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-desktop
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    - id: ui-desktop-update
      name: '@deepseek-ai/dsh-client-ui-desktop-update'
