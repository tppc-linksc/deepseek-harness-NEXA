name: NEXA desktop release

on:
  push:
    tags:
      - 'nexa-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing nexa-v<version> tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nexa-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Require a NEXA version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^nexa-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must match nexa-v<version>" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 DMG
            runner: macos-14
            command: pnpm run package:desktop:mac
            artifact: desktop-mac-arm64
            path: dist/installers/DeepSeek-NEXA-*-mac-arm64.dmg
          - name: Windows x64 NSIS
            runner: windows-2025
            command: pnpm run package:desktop:win
            artifact: desktop-win-x64
            path: dist/installers/DeepSeek-NEXA-*-win-x64.exe
          - name: Linux x64 AppImage
            runner: ubuntu-24.04
            command: pnpm run package:desktop:linux
            artifact: desktop-linux-x64
            path: dist/installers/DeepSeek-NEXA-*-linux-x64.AppImage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: desktop-release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and update manifest
        run: pnpm run release:desktop:manifest -- --assets release-assets --output release-assets --tag "$RELEASE_TAG"

      - name: Publish GitHub Release
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#nexa-v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "DeepSeek NEXA $VERSION" \
              --generate-notes \
              --latest
          fi
